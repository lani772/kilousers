<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LUMA – User Management</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(160deg,#080c1a,#0e1230 50%,#080c1a);min-height:100vh;color:#fff;font-family:'Inter',system-ui,sans-serif;max-width:430px;margin:0 auto;overflow-x:hidden;position:relative}
  input,button{font-family:inherit;outline:none}
  input{color:#fff;border:none;background:none}
  input::placeholder{color:#4b5563}
  button{cursor:pointer}
  *{scrollbar-width:none}
  *::-webkit-scrollbar{display:none}
  .tp{display:none;padding:14px 20px 0;position:relative;z-index:1}
</style>
</head>
<body>

<!-- Ambient glows -->
<div style="position:fixed;top:-80px;right:5%;width:240px;height:240px;background:radial-gradient(circle,rgba(124,58,237,.18),transparent 70%);pointer-events:none;z-index:0"></div>
<div style="position:fixed;top:200px;left:-10%;width:180px;height:180px;background:radial-gradient(circle,rgba(6,182,212,.1),transparent 70%);pointer-events:none;z-index:0"></div>

<!-- Header -->
<header style="padding:22px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1">
  <div>
    <p style="font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:1px">LUMA Smart Home</p>
    <h1 style="font-size:26px;font-weight:800;margin:2px 0 0;line-height:1.1;background:linear-gradient(90deg,#fff 30%,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent">User Management</h1>
    <p id="cnt" style="font-size:11px;color:#4b5563;margin-top:3px"></p>
  </div>
  <button onclick="go('invites')" style="margin-top:6px;padding:9px 16px;border-radius:12px;border:none;background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(124,58,237,.45);flex-shrink:0">+ Invite</button>
</header>

<!-- Search -->
<div style="padding:14px 20px 0;position:relative;z-index:1">
  <div style="position:relative">
    <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;color:#4b5563;pointer-events:none">🔍</span>
    <input type="text" placeholder="Search by name or email…" oninput="onSearch(this.value)" style="width:100%;padding:11px 14px 11px 38px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);color:#fff;font-size:13px;caret-color:#7c3aed">
  </div>
</div>

<!-- Stats -->
<div id="stats" style="padding:12px 20px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative;z-index:1"></div>

<!-- Tab bar -->
<div id="tabbar" style="padding:14px 20px 0;display:flex;gap:6px;overflow-x:auto;position:relative;z-index:1"></div>

<!-- Tab panels -->
<div id="tab-members" class="tp"></div>
<div id="tab-permissions" class="tp"></div>
<div id="tab-activity" class="tp"></div>
<div id="tab-invites" class="tp"></div>

<div style="height:90px"></div>

<!-- Save toast -->
<div id="toast" style="position:fixed;bottom:82px;left:50%;transform:translateX(-50%);border-radius:16px;padding:10px 18px;display:none;align-items:center;gap:10px;z-index:300;white-space:nowrap;box-shadow:0 8px 28px rgba(124,58,237,.5)"></div>

<!-- Bottom nav -->
<nav style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(8,12,26,.96);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.07);padding:10px 8px 20px;display:flex;justify-content:space-around;z-index:200">
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:50px"><span style="font-size:22px">🏠</span><span style="font-size:10px;color:#4b5563">Home</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:50px"><span style="font-size:22px">💡</span><span style="font-size:10px;color:#4b5563">Lamps</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:50px"><span style="font-size:22px">⚡</span><span style="font-size:10px;color:#4b5563">Energy</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:50px"><span style="font-size:22px">👥</span><span style="font-size:10px;font-weight:700;color:#a78bfa">Users</span><div style="width:22px;height:2.5px;border-radius:2px;background:linear-gradient(90deg,#7c3aed,#6366f1)"></div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:50px"><span style="font-size:22px">⋯</span><span style="font-size:10px;color:#4b5563">More</span></div>
</nav>

<script>
// ── CONSTANTS ──────────────────────────────────────────────
const ROLES={
  owner: {label:'Owner', c:'#f59e0b',bg:'rgba(245,158,11,0.18)', icon:'👑'},
  admin: {label:'Admin', c:'#7c3aed',bg:'rgba(124,58,237,0.18)',icon:'🛡️'},
  member:{label:'Member',c:'#06b6d4',bg:'rgba(6,182,212,0.18)', icon:'👤'},
  guest: {label:'Guest', c:'#9ca3af',bg:'rgba(156,163,175,0.15)',icon:'🔗'},
};
const PD=[
  {k:'lamps', i:'💡',l:'Lamps'},   {k:'energy',i:'⚡',l:'Energy'},
  {k:'sched', i:'🕐',l:'Schedule'},{k:'users', i:'👥',l:'Users'},
  {k:'cfg',   i:'⚙️',l:'Settings'},{k:'logs',  i:'📋',l:'Logs'},
];
const LN=['Living Rm','Bedroom','Kitchen','Porch','Study','Garage'];
const AG=[['#7c3aed','#6366f1'],['#ec4899','#f43f5e'],['#06b6d4','#0ea5e9'],['#10b981','#059669'],['#f59e0b','#d97706']];
const ACT=[
  {uid:2,action:'turned on',     target:'Kitchen Downlight',time:'2m ago', icon:'💡',c:'#10b981'},
  {uid:4,action:'dimmed to 60%', target:'Living Room Main', time:'14m ago',icon:'🔅',c:'#f59e0b'},
  {uid:1,action:'set schedule',  target:'Bedroom Ceiling',  time:'1h ago', icon:'🕐',c:'#7c3aed'},
  {uid:3,action:'turned off',    target:'Study Desk Lamp',  time:'2h ago', icon:'💡',c:'#ef4444'},
  {uid:2,action:'invited user',  target:'David P. (Guest)', time:'3h ago', icon:'👤',c:'#06b6d4'},
  {uid:1,action:'role changed',  target:'Alice → Admin',    time:'5h ago', icon:'🛡️',c:'#a78bfa'},
  {uid:3,action:'adjusted color',target:'Kitchen Downlight',time:'2d ago', icon:'🎨',c:'#ec4899'},
  {uid:5,action:'turned on',     target:'Living Room Main', time:'2d ago', icon:'💡',c:'#10b981'},
];
const IU=[
  {id:1,name:'Umurage K.',email:'umurage@luma.rw', role:'owner', av:'UK',ai:0,online:true, seen:'Now',    joined:'Jan 2025',acts:47,lamps:[0,1,2,3,4,5],perms:{lamps:true,energy:true,sched:true,users:true,cfg:true,logs:true}},
  {id:2,name:'Alice M.',  email:'alice@luma.rw',   role:'admin', av:'AM',ai:1,online:true, seen:'2m ago', joined:'Mar 2025',acts:31,lamps:[0,1,2,3,4,5],perms:{lamps:true,energy:true,sched:true,users:true,cfg:false,logs:true}},
  {id:3,name:'Bob N.',    email:'bob@luma.rw',     role:'member',av:'BN',ai:2,online:false,seen:'1h ago', joined:'May 2025',acts:18,lamps:[0,2,3],       perms:{lamps:true,energy:true,sched:false,users:false,cfg:false,logs:false}},
  {id:4,name:'Claire R.', email:'claire@luma.rw',  role:'member',av:'CR',ai:3,online:true, seen:'15m ago',joined:'Jun 2025',acts:12,lamps:[0,1,4],       perms:{lamps:true,energy:false,sched:false,users:false,cfg:false,logs:false}},
  {id:5,name:'David P.',  email:'david@guest.rw',  role:'guest', av:'DP',ai:4,online:false,seen:'2d ago', joined:'Jun 2026',acts:3, lamps:[0],           perms:{lamps:true,energy:false,sched:false,users:false,cfg:false,logs:false},exp:'Jun 30'},
];

// ── STATE ──────────────────────────────────────────────────
let S={
  tab:'members',search:'',exp:null,rf:'all',ps:'features',
  changed:false,saveOk:false,ie:'',ir:'member',is:false,cd:null,
  users:IU.map(u=>({...u,perms:{...u.perms},lamps:[...u.lamps]})),
  perms:Object.fromEntries(IU.map(u=>[u.id,{...u.perms}])),
  lamps:Object.fromEntries(IU.map(u=>[u.id,[...u.lamps]])),
  invites:[
    {id:'i1',email:'emma@kigali.rw',role:'member',sent:'2h ago',exp:'Jun 30'},
    {id:'i2',email:'john@rw.rw',    role:'guest', sent:'1d ago',exp:'Jun 25'},
  ],
};

// ── HELPERS ────────────────────────────────────────────────
const CS='background:rgba(255,255,255,.04);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:16px;';

function avi(u,sz=44){
  const[g1,g2]=AG[u.ai%AG.length];
  const r=sz*.28,is=sz*.22;
  return`<div style="position:relative;flex-shrink:0"><div style="width:${sz}px;height:${sz}px;border-radius:${r}px;background:linear-gradient(135deg,${g1},${g2});display:flex;align-items:center;justify-content:center;font-size:${sz*.3}px;font-weight:800;color:#fff;letter-spacing:-.5px">${u.av}</div>${u.online?`<div style="position:absolute;bottom:0;right:0;width:${is}px;height:${is}px;border-radius:50%;background:#10b981;border:2px solid #080c1a"></div>`:''}</div>`;
}
function bdg(role){
  const r=ROLES[role];
  return`<span style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;background:${r.bg};color:${r.c};border:1px solid ${r.c}40">${r.icon} ${r.label}</span>`;
}

// ── ACTIONS ────────────────────────────────────────────────
function go(t){S.tab=t;S.exp=null;ra();}
function onSearch(v){S.search=v;rM();}
function setRF(rf){S.rf=rf;rM();}
function togExp(uid){S.exp=S.exp===uid?null:uid;S.cd=null;rM();}
function setPS(ps){S.ps=ps;rP();}
function setCD(uid){S.cd=uid;rM();}
function cancCD(){S.cd=null;rM();}

function togPerm(uid,k){
  if(S.users.find(u=>u.id===uid)?.role==='owner')return;
  S.perms[uid]={...S.perms[uid],[k]:!S.perms[uid][k]};
  S.changed=true;rP();rToast();
}
function togLamp(uid,li){
  if(S.users.find(u=>u.id===uid)?.role==='owner')return;
  const c=S.lamps[uid]||[];
  S.lamps[uid]=c.includes(li)?c.filter(x=>x!==li):[...c,li];
  S.changed=true;rP();rToast();
}
function saveChg(){
  S.changed=false;S.saveOk=true;rToast();
  setTimeout(()=>{S.saveOk=false;rToast();},2500);
}
function undoChg(){
  S.perms=Object.fromEntries(IU.map(u=>[u.id,{...u.perms}]));
  S.lamps=Object.fromEntries(IU.map(u=>[u.id,[...u.lamps]]));
  S.changed=false;rP();rToast();
}
function remUser(uid){S.users=S.users.filter(u=>u.id!==uid);S.exp=null;S.cd=null;ra();}

function onIE(v){
  S.ie=v;
  const el=document.getElementById('ieinp');
  if(el)el.style.borderColor=v&&!v.includes('@')?'#ef4444':'rgba(255,255,255,.07)';
  const er=document.getElementById('ieerr');
  if(er)er.style.display=v&&!v.includes('@')?'block':'none';
  const bt=document.getElementById('iesnd');
  if(bt){
    const ok=v.includes('@');
    bt.disabled=!ok;
    bt.style.background=ok?'linear-gradient(135deg,#7c3aed,#6366f1)':'rgba(255,255,255,.05)';
    bt.style.color=ok?'#fff':'#4b5563';
    bt.style.cursor=ok?'pointer':'not-allowed';
    bt.style.boxShadow=ok?'0 4px 16px rgba(124,58,237,.45)':'none';
  }
}
function setIR(r){S.ir=r;rI();}
function sendInv(){
  if(!S.ie.includes('@'))return;
  S.invites=[{id:'i'+Date.now(),email:S.ie,role:S.ir,sent:'Just now',exp:'Jul 23'},...S.invites];
  S.ie='';S.is=true;rI();
  setTimeout(()=>{S.is=false;rI();},3000);
}
function cancInv(id){S.invites=S.invites.filter(i=>i.id!==id);rI();}

// ── RENDER ─────────────────────────────────────────────────
function rCnt(){
  const on=S.users.filter(u=>u.online).length;
  document.getElementById('cnt').textContent=`${S.users.length} members · ${on} online now`;
}

function rStats(){
  const on=S.users.filter(u=>u.online).length;
  const ad=S.users.filter(u=>u.role==='admin'||u.role==='owner').length;
  const gs=S.users.filter(u=>u.role==='guest').length;
  document.getElementById('stats').innerHTML=[
    {l:'Total',v:S.users.length,c:'#7c3aed',i:'👥'},
    {l:'Online',v:on,c:'#10b981',i:'●'},
    {l:'Admins',v:ad,c:'#f59e0b',i:'🛡️'},
    {l:'Guests',v:gs,c:'#9ca3af',i:'🔗'},
  ].map(d=>`<div style="background:rgba(255,255,255,.04);border:1px solid ${d.c}25
